<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploring Infinity — ToonTalk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♾️</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: radial-gradient(1200px 800px at 50% 0%, #23233a, #101018 70%);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; color: #d7d7e4;
  }

  /* ---- top bar ---------------------------------------------------------- */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 9px 16px; border-bottom: 1px solid #33334a; background: #191924;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #ececf4; margin: 0; }
  header .sub { color: #7b7b93; font-size: 12px; }
  .spacer { flex: 1; }
  .seg { display: flex; border: 1px solid #44445a; border-radius: 6px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; color: #d7d7e4; background: #2a2a3a;
    border: 0; border-right: 1px solid #44445a; padding: 5px 12px; cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: #34344a; }
  .seg button[aria-pressed="true"] { background: #AB0519; color: #fff; }
  a.plain { color: #9d9db4; text-decoration: none; font-size: 13px; }
  a.plain:hover { color: #d7d7e4; text-decoration: underline; }

  /* ---- three columns ---------------------------------------------------- */
  main { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 246px; flex: none; overflow-y: auto; padding: 12px 10px 24px;
    border-right: 1px solid #33334a; background: #14141d;
  }
  nav h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: #7b7b93; margin: 14px 6px 6px;
  }
  nav h2:first-child { margin-top: 2px; }
  .item {
    font: inherit; text-align: left; width: 100%; cursor: pointer;
    color: #d7d7e4; background: #191924; border: 1px solid #33334a;
    border-radius: 6px; padding: 6px 9px; margin-bottom: 4px; display: block;
    text-decoration: none;
  }
  a.item b { font-weight: 500; font-size: 12.5px; }
  .item:hover { background: #2f2f44; border-color: #55556e; }
  .item[aria-current="true"] { background: #2c2c3e; border-color: #AB0519; }
  .item b { display: block; font-size: 13px; color: #ececf4; font-weight: 600; }
  .item span { display: block; color: #9d9db4; font-size: 12px; line-height: 1.35; margin-top: 2px; }

  .panes { flex: 1; display: flex; min-width: 0; }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  #sheetpane { flex: 1.05; border-right: 1px solid #33334a; }
  #ttpane { flex: 1; background: #0d0d14; }
  .panehead {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; background: #191924; border-bottom: 1px solid #33334a;
    font-size: 12px; color: #9d9db4; min-height: 34px;
  }
  .panehead strong { color: #ececf4; font-size: 13px; font-weight: 600; }
  .panehead button {
    font: inherit; font-size: 12px; color: #d7d7e4; background: #2a2a3a;
    border: 1px solid #44445a; border-radius: 5px; padding: 3px 10px; cursor: pointer;
  }
  .panehead button:hover { background: #34344a; }
  .panehead button.go { background: #7a1020; border-color: #99162a; color: #fff; }
  .panehead button.go:hover { background: #99162a; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  #tt { background: #0d0d14; }
  .panehead input {
    font: inherit; font-size: 12px; color: #ececf4; background: #12121b;
    border: 1px solid #44445a; border-radius: 5px; padding: 3px 7px;
  }

  /* what this activity needs in ToonTalk, offered where the activity is */
  .matbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 10px; background: #101018; border-bottom: 1px solid #33334a;
    font-size: 12px; color: #9d9db4;
  }
  .matbar[hidden] { display: none; }
  .matbar button {
    font: inherit; font-size: 12px; color: #fff; background: #7a1020;
    border: 1px solid #99162a; border-radius: 5px; padding: 3px 10px; cursor: pointer;
  }
  .matbar button:hover { background: #99162a; }
  .matbar button.done { background: #1c6b52; border-color: #2b8a6c; }
  .matbar button.done::before { content: "✓ "; }

  /* view modes: the pane toggle just hides one side */
  body[data-view="sheet"] #ttpane { display: none; }
  body[data-view="tt"] #sheetpane { display: none; }
  body[data-view="tt"] nav { display: none; }

  @media (max-width: 900px) {
    nav { width: 190px; }
    .panes { flex-direction: column; }
    #sheetpane { border-right: 0; border-bottom: 1px solid #33334a; }
  }
</style>
</head>
<body data-view="split">

<header>
  <h1>Exploring Infinity</h1>
  <span class="sub">Cardinality of infinite sets, in ToonTalk</span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="sheet">Sheet</button>
    <button type="button" data-view="split" aria-pressed="true">Split</button>
    <button type="button" data-view="tt">ToonTalk</button>
  </div>
  <a class="plain" href="../tt.html">← Back to the launcher</a>
</header>

<main>
  <nav id="nav"></nav>
  <div class="panes">
    <section class="pane" id="sheetpane">
      <div class="panehead">
        <strong id="sheettitle">Overview</strong>
        <div class="seg" id="fmt" role="group" aria-label="Sheet format">
          <button type="button" data-fmt="html" aria-pressed="true"
                  title="Reads on screen: fits the pane, and the boxes that were writing space
                         on paper become things to think about">Read</button>
          <button type="button" data-fmt="pdf"
                  title="The worksheet exactly as it was written, for printing">Printed page</button>
        </div>
        <span class="spacer"></span>
        <button type="button" id="openraw" title="Open this sheet in its own tab">Open in a tab ↗</button>
      </div>
      <div class="matbar" id="matbar" hidden></div>
      <iframe id="sheet" title="Activity sheet"></iframe>
    </section>
    <section class="pane" id="ttpane">
      <div class="panehead">
        <strong>ToonTalk</strong>
        <span id="ttnote"></span>
        <span class="spacer"></span>
        <button type="button" id="ttmarty"
                title="Chat with Marty about what you are doing — he knows these activities">🛸 Ask Marty</button>
        <button type="button" class="go" id="ttfull" title="Give ToonTalk the whole window">Full width</button>
      </div>
      <iframe id="tt" title="ToonTalk"
              allow="fullscreen; pointer-lock; autoplay; clipboard-read; clipboard-write"></iframe>
    </section>
  </div>
</main>

<script>
// The activity sequence (v8, the revision tested in Oxford and Bulgaria in 2005). Titles and
// aims are the sequence document's own; each entry names the worksheet Word produced and the
// ToonTalk material that activity needs. `res` is a .tt file staged in assets/toontalk/infinity,
// loaded by the engine's own sprite_from_file_name() via ?ttfile=.
var SHEETS = 'sheets/';
var ACTIVITIES = [
  { id: 'a1', kind: 'act', n: 1, title: 'The even numbers, two ways',
    blurb: 'A proper subset that is still the same size',
    file: 'Cardinality_Activity_1.htm', res: 'Cardinality1to8.tt' },
  { id: 'a2', kind: 'act', n: 2, title: 'Combining sequences — part 1',
    blurb: 'Making all the integers, and counting them',
    file: 'Cardinality_Activity_2.htm', res: 'Cardinality1to8.tt' },
  { id: 'a3', kind: 'act', n: 3, title: 'A variety of sequences',
    blurb: 'Every sequence you can build turns out to be countable',
    file: 'Cardinality_Activity_3.htm', res: 'Cardinality1to8.tt' },
  { id: 'a4', kind: 'act', n: 4, title: 'All fractions between 0 and 1',
    blurb: 'The obvious enumerations fail; this one works',
    file: 'Cardinality_Activity_4.htm', res: 'Cardinality1to8.tt',
    also: [['NoCopies.tt', 'Remove duplicate fractions'],
           ['no_box_copies.tt', 'Remove duplicate boxes']] },
  { id: 'extra4', kind: 'act', title: 'Extra task for activity 4',
    blurb: 'A further fractions challenge',
    file: 'Extra Cardinality Activity 4 Task.htm', res: 'Cardinality1to8.tt' },
  { id: 'a5', kind: 'act', n: 5, title: 'Rational numbers greater than 1',
    blurb: 'Reciprocals — and a one-to-one map falls out of it',
    file: 'Cardinality_Activity_5.htm', res: 'Cardinality1to8.tt' },
  { id: 'a6', kind: 'act', n: 6, title: 'Combining sequences — part 2',
    blurb: 'Merging to get all the rationals',
    file: 'Cardinality_Activity_6.htm', res: 'Cardinality1to8.tt' },
  { id: 'a7', kind: 'act', n: 7, title: 'Rationals between any two numbers',
    blurb: 'Scale and shift the unit interval; density',
    file: 'Cardinality_Activity_7.htm', res: 'Cardinality1to8.tt' },
  { id: 'a8', kind: 'act', n: 8, title: 'Counting sequences',
    blurb: "Cantor's diagonal, built out of robots",
    file: 'Cardinality_Activity_8.htm', res: 'Cardinality1to8.tt',
    also: [['Diagonal.tt', 'The Diagonal team']] },
  { id: 'thotel', kind: 'act', title: 'Resort Infinity',
    blurb: "To finish: Hilbert's hotel as a city of five problems",
    file: 'resort_infinity.htm',
    // The two .tt files are READY-MADE SOLUTION boxes (an "i,j -> i" build robot; an
    // "i -> i+5" move robot) -- labelled as the spoilers they are, not as "tasks", which
    // made two near-identical boxes look like a bug (Ken, 2026-08-12).
    also: [['resort_infinity.xml.cty', 'The hotel city'],
           ['resort_infinity_task1.tt', 'Answer to problem 1 (spoiler)'],
           ['resort_infinity_task2.tt', 'Answer to problem 2 (spoiler)']] },

  { id: 'tnotebook', kind: 'tool', title: 'The activity notebook',
    blurb: 'A notebook of notebooks — one page of robots per activity',
    file: 'notebook.htm', res: 'Cardinality1to8.tt' },
  { id: 'tdiag', kind: 'tool', title: 'Diagonal tool',
    blurb: 'Feed it sequences and work out what it does (activity 8)',
    file: 'diagonal.htm', res: 'Diagonal.tt' },
  { id: 'tnocopy', kind: 'tool', title: 'Remove duplicate fractions',
    blurb: '2/6 never gets past, because 1/3 already did (activity 4)',
    file: 'no_copies.htm', res: 'NoCopies.tt' },
  { id: 'overview', kind: 'teach', title: 'The activity sequence',
    blurb: 'Aims, setting and assessment for all eight activities',
    file: 'cardinality_activity_sequence_v8.htm' },
  { id: 'guide', kind: 'teach', title: 'Teacher guidance',
    blurb: 'How to run the sessions', file: 'guidance.htm' },
  { id: 'guide2', kind: 'teach', title: 'More guidance',
    blurb: 'Further notes for teachers', file: 'guidance2.htm' },
  { id: 'hotelguide', kind: 'teach', title: 'Resort Infinity guide',
    blurb: 'Answers for the five hotel problems', file: 'resort_infinity_guide.htm' },
  { id: 'hist', kind: 'teach', title: 'Historical note',
    blurb: 'Galileo to Cantor, in brief', file: 'historical_note.htm' }
];

// Learner first: the eight activities are what this page is for. The activity-sequence
// document is a researcher's document about them, so it sits with the teacher material.
var GROUPS = [
  ['The eight activities', 'act'], ['Tools', 'tool'], ['For teachers', 'teach']
];

var sheet = document.getElementById('sheet');
var tt = document.getElementById('tt');
var current = null;          // the activity showing in the sheet pane
var fmt = 'html';            // 'html' (reads on screen) or 'pdf' (the printed page)

// The worksheets exist in both forms. Word's PDF keeps the page they were written on --
// which matters, because these sheets position speech balloons over the Martys saying them,
// and Word's HTML export turns those pictures into page-coordinate absolutes that land
// somewhere else entirely once the pane reflows. The site's own pages were HTML to begin
// with and have no PDF; for those the toggle is hidden.
function sheetURL(a) {
  if (fmt === 'pdf' && a.file.slice(-4) === '.htm' && a.kind !== 'tool' && a.kind !== 'teach') {
    return SHEETS + 'pdf/' + encodeURIComponent(a.file.slice(0, -4) + '.pdf') + '#view=FitH';
  }
  return SHEETS + encodeURIComponent(a.file);
}
function hasPDF(a) { return a.kind !== 'tool' && a.kind !== 'teach'; }

// ?freeplay=1 is the app's own opening flow with the chooser skipped: the usual name-and-head
// dialog, aimed at free play. The pane deliberately has NO name handling of its own -- an
// earlier version remembered the last name and applied it silently, and the time-travel logs
// recorded under that name began replaying (Ken, 2026-08-12). Materials load on demand once
// the learner is on the floor.
// tt-ai.html rather than tt.html: the same generated page plus the Marty AI chat, whose
// briefing includes these activities -- so Marty can play the researcher's role here
// ("what would happen if the robots ran forever?").
var TT_URL = '../tt-ai.html?freeplay=1';

// What each activity needs, named the way the sheets name it. An activity lists only what it
// is the FIRST to need -- the notebook of robots at activity 1, the duplicate remover at
// activity 4, the Diagonal team at activity 8 -- because everything loaded earlier is still
// there. Loading puts the material into the running world; nothing restarts.
function materials(a) {
  var m = [];
  if (a.res) m.push([a.res, a.res === 'Cardinality1to8.tt' ? 'The activity notebook' : a.res.replace(/\.(tt|xml\.cty)$/, '')]);
  (a.also || []).forEach(function (x) { m.push(x); });
  return m;
}

function show(a) {
  current = a;
  sheet.src = sheetURL(a);
  document.getElementById('fmt').style.visibility = hasPDF(a) ? '' : 'hidden';
  document.getElementById('sheettitle').textContent =
    (a.kind === 'act' && a.n ? 'Activity ' + a.n + ' — ' : '') + a.title;
  Array.prototype.forEach.call(document.querySelectorAll('.item'), function (b) {
    b.setAttribute('aria-current', b.dataset.id === a.id ? 'true' : 'false');
  });

  // Switching sheets deliberately does NOT touch the ToonTalk pane: the engine takes a while
  // to load and the learner's own work is in there.
  var bar = document.getElementById('matbar'), mats = materials(a);
  if (!mats.length) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = '<span>For this activity you need:</span>';
  mats.forEach(function (m) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.file = m[0];
    b.textContent = (loaded[m[0]] ? '' : 'Load ') + m[1];
    if (loaded[m[0]]) b.className = 'done';
    // A city REPLACES the world; everything else arrives in the hand. (The tooltip used to
    // append ".tt" to a name that already had its extension, and promise a city in your
    // hand -- Ken, 2026-08-12.)
    var isCity = /\.cty$/.test(m[0]);
    b.title = loaded[m[0]]
      ? (isCity ? 'Load the city again — this restarts it' : 'Already loaded — get another copy')
      : (isCity ? 'Load this city: it replaces the world you are in'
                : 'Put ' + m[0] + ' into your hand');
    bar.appendChild(b);
  });
}

// Which files have been handed over this session, so the buttons can say so.
var loaded = {};

function loadMaterial(name, label) {
  var w = tt.contentWindow, ret = 0;
  try { ret = (w && typeof w.TT_loadMaterial === 'function') ? w.TT_loadMaterial(name) : 0; }
  catch (e) { ret = 0; }
  var note = document.getElementById('ttnote');
  if (ret === 2) {          // a city: the load replaced the whole world
    loaded[name] = true;
    note.textContent = (label || name) + ' has been loaded — you are in it now';
    if (current) show(current);
  } else if (ret === 1) {   // an object: pending for the hand
    loaded[name] = true;
    // Tooly brings it to the FLOOR (Toolbox::add_sprite), not to the hand. And the canned
    // resort answers ship with an EMPTY Guests hole -- a nest cannot ride in a file -- so
    // giving one to the Solution bird unchanged builds nothing (Ken, 2026-08-12).
    note.textContent = /^resort_infinity_task/.test(name)
      ? (label || name) + ' has arrived on the floor — put the problem’s nest in its empty ' +
        'Guests hole, then give it to the Solution bird'
      : (label || name) + ' has arrived on the floor';
    if (current) show(current);
  } else {
    note.textContent = 'ToonTalk is still starting up — try again in a moment';
  }
  return ret;
}

// ---- build the rail --------------------------------------------------------
var nav = document.getElementById('nav'), html = '';
GROUPS.forEach(function (g) {
  html += '<h2>' + g[0] + '</h2>';
  ACTIVITIES.filter(function (a) { return a.kind === g[1]; }).forEach(function (a) {
    html += '<button type="button" class="item" data-id="' + a.id + '"><b>' +
            (a.kind === 'act' && a.n ? a.n + '. ' : '') + a.title + '</b><span>' +
            a.blurb + '</span></button>';
  });
});
// The programs themselves, as files. They are preloaded into the engine's filesystem for the
// buttons above, but they are also served here so they can be downloaded and opened in a
// desktop ToonTalk, mailed to someone, or kept.
var FILES = [
  ['Cardinality1to8.tt', 'robots for all eight activities'],
  ['Diagonal.tt', "Cantor's diagonal team"],
  ['NoCopies.tt', 'drop duplicate fractions'],
  ['no_box_copies.tt', 'the same, for boxes'],
  ['resort_infinity_task1.tt', 'hotel task 1'],
  ['resort_infinity_task2.tt', 'hotel task 2'],
  ['resort_infinity.xml.cty', 'the hotel city']
];
html += '<h2>ToonTalk files</h2>';
FILES.forEach(function (f) {
  html += '<a class="item" href="tt/' + f[0] + '" download><b>' + f[0] +
          '</b><span>' + f[1] + '</span></a>';
});
nav.innerHTML = html;
nav.addEventListener('click', function (e) {
  var b = e.target.closest('.item');
  if (b && b.dataset.id) show(ACTIVITIES.filter(function (a) { return a.id === b.dataset.id; })[0]);
});

// ---- view toggle -----------------------------------------------------------
document.querySelector('.seg').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  document.body.dataset.view = b.dataset.view;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
  });
});
document.getElementById('ttfull').addEventListener('click', function () {
  document.querySelector('.seg button[data-view="tt"]').click();
});
document.getElementById('ttmarty').addEventListener('click', function () {
  var w = tt.contentWindow;
  try {
    if (w && typeof w.TT_martyToggle === 'function') { w.TT_martyToggle(); return; }
  } catch (e) {}
  document.getElementById('ttnote').textContent = 'ToonTalk is still starting up — try again in a moment';
});
document.getElementById('matbar').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-file]');
  if (b) loadMaterial(b.dataset.file, b.textContent.replace(/^(Load |✓ )/, ''));
});
document.getElementById('openraw').addEventListener('click', function () {
  if (current) window.open(sheetURL(current), '_blank');
});
document.getElementById('fmt').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  fmt = b.dataset.fmt;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
  });
  if (current) show(current);
});

// A .tt link inside one of the original site pages became a load button; the sheet iframe is
// same-origin, so listen for those clicks and route them through loadMaterials.
sheet.addEventListener('load', function () {
  var d;
  try { d = sheet.contentDocument; } catch (err) { return; }
  if (!d) return;
  d.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-load]');
    if (!a) return;
    e.preventDefault();
    loadMaterial(a.dataset.load);
  });
});

// ---- start -----------------------------------------------------------------
show(ACTIVITIES[0]);                 // activity 1, not the researchers' overview
tt.src = TT_URL;                     // opens on the usual name dialog; the engine loads behind it
</script>
</body>
</html>
